name: BuildExchange local workflow checks
on:
  pull_request:
    paths: ['buildexchange/**', '.github/workflows/buildexchange.yml']
  workflow_dispatch:
jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buildexchange
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test exchange
